name: Release
on:
  push:
    tags: ["v*"]

# A tag releases the ports whose version in release.json moved since the previous tag
# (bun tools/release/release.ts prepare bumps only those). Every port is still built, so the
# GitHub release always carries the full set, but the stores only hear about what changed.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Versions agree with release.json and the tag
        run: bun tools/release/release.ts check --tag "$GITHUB_REF_NAME"
      - name: Palette, themes and tests, once for every port
        run: bun run check
      - id: plan
        name: Ports this tag releases
        run: |
          changed=$(bun tools/release/release.ts changed --tag "$GITHUB_REF_NAME")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "### Released ports: $changed" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [vsc, zed, jetbrains, neovim, sublime, notepadpp, telegram, spicetify, browser]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Each job installs only what its port needs: the checks ran once in plan, and CI validates every push.
      - uses: actions/setup-java@v5
        if: matrix.pkg == 'jetbrains'
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - run: bun install --frozen-lockfile
      - run: bun run package:${{ matrix.pkg }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}-dist
          path: dist/*

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v5
        if: contains(fromJSON(needs.plan.outputs.changed), 'jetbrains')
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Firefox on addons.mozilla.org
        if: contains(fromJSON(needs.plan.outputs.changed), 'browser')
        env:
          FIREFOX_JWT_USER: ${{ secrets.FIREFOX_JWT_USER }}
          FIREFOX_JWT_TOKEN: ${{ secrets.FIREFOX_JWT_TOKEN }}
        run: |
          if [ -z "$FIREFOX_JWT_USER" ] || [ -z "$FIREFOX_JWT_TOKEN" ]; then
            echo "::warning::FIREFOX_JWT_USER / FIREFOX_JWT_TOKEN not set, the Firefox build stays an unsigned zip"
            exit 0
          fi
          v=$(node -p "require('./release.json').ports.browser")
          bun tools/release/release.ts section --port browser --format text > /tmp/amo-notes.txt
          # AMO reviews the human-readable source of bundled code: the browser port and what it imports.
          git archive --format=zip -o /tmp/source.zip HEAD browser tools/jb-palette.json palette/palette.json package.json bun.lock release.json
          set +e
          bun tools/release/amo.ts --addon hatsune-miku-tab@vai-rice.space \
            --file "dist/hatsune-miku-editor-firefox-$v.zip" --source /tmp/source.zip \
            --notes /tmp/amo-notes.txt --out "dist/hatsune-miku-editor-firefox-$v.xpi" \
            --approval-notes "Build: bun install --frozen-lockfile && bun browser/build.ts --zip (Bun 1.3+). The add-on is browser/build/firefox." \
            --wait 900
          code=$?
          set -e
          case $code in
            0) echo "Mozilla signed $v, the release carries the .xpi" ;;
            3) echo "::warning::Firefox $v is listed and waits for Mozilla's review; the release keeps the unsigned zip" ;;
            *) echo "::warning::AMO submission failed, the release keeps the unsigned zip" ;;
          esac

      - name: Release notes from the changelogs
        run: bun tools/release/release.ts notes --tag "$GITHUB_REF_NAME" | tee /tmp/notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: /tmp/notes.md
          # The "latest" hub below carries the Latest mark, so its stable links always work.
          make_latest: "false"

      - name: Refresh the latest hub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun tools/release/hub.ts assets --dir dist --out /tmp/hub
          # Link only what the hub will hold: this release's builds plus what it already carries.
          ls /tmp/hub > /tmp/have.txt
          gh release view latest --json assets -q '.assets[].name' >> /tmp/have.txt 2>/dev/null || true
          bun tools/release/hub.ts notes --tag "$GITHUB_REF_NAME" --have /tmp/have.txt > /tmp/hub.md
          title="Hatsune Miku themes: every app, newest build"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest /tmp/hub/* --clobber
            gh release edit latest --title "$title" --notes-file /tmp/hub.md --latest
          else
            gh release create latest /tmp/hub/* --title "$title" --notes-file /tmp/hub.md --latest --target "$GITHUB_SHA"
          fi

      - name: Refresh the themes branch
        run: |
          # Files of ports this tag did not rebuild stay as they are; new builds go on top.
          mkdir -p /tmp/all
          if git fetch origin themes:themes 2>/dev/null; then
            git worktree add /tmp/themes themes
            find /tmp/themes -mindepth 2 -type f -not -path '*/.git/*' -exec cp {} /tmp/all/ \;
            git -C /tmp/themes rm -rq .
          else
            git worktree add --orphan -b themes /tmp/themes
          fi
          cp /tmp/hub/* /tmp/all/
          bun tools/release/hub.ts branch --dir /tmp/all --out /tmp/themes --tag "$GITHUB_REF_NAME"
          cd /tmp/themes
          git add -A
          if git diff --cached --quiet; then
            echo "The themes branch already matches $GITHUB_REF_NAME"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "themes: downloads from $GITHUB_REF_NAME"
            git push origin themes
          fi

      - name: Telegram cloud themes
        if: contains(fromJSON(needs.plan.outputs.changed), 'telegram')
        uses: Vadim-Khristenko/telegram-theme-action@v1
        with:
          session: ${{ secrets.TELEGRAM_THEME_SESSION }}
          themes: tools/telegram/cloud.yml
          # A Telegram hiccup should not undo a release that is already out.
          fail-on-error: "false"

      - name: Publish to Open VSX
        if: contains(fromJSON(needs.plan.outputs.changed), 'vsc')
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -n "$OVSX_TOKEN" ]; then
            bun x ovsx publish dist/*.vsix --pat "$OVSX_TOKEN" || echo "::warning::Open VSX publish failed"
          else
            echo "OVSX_TOKEN not set, skipping"
          fi

      - name: Publish to JetBrains Marketplace
        if: contains(fromJSON(needs.plan.outputs.changed), 'jetbrains')
        env:
          PUBLISH_TOKEN: ${{ secrets.JB_TOKEN }}
        run: |
          if [ -n "$PUBLISH_TOKEN" ]; then
            cd jetbrains
            ./gradlew publishPlugin --no-daemon -q || echo "::warning::JetBrains publish failed"
          else
            echo "JB_TOKEN not set, skipping"
          fi
