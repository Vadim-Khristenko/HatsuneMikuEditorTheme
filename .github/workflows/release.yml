name: Release
on:
  push:
    tags: ["v*"]

# A tag releases the ports whose version in release.json moved since the previous tag
# (bun tools/release/release.ts prepare bumps only those). Every port is still built, so the
# GitHub release always carries the full set, but the stores only hear about what changed.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Versions agree with release.json and the tag
        run: bun tools/release/release.ts check --tag "$GITHUB_REF_NAME"
      - id: plan
        name: Ports this tag releases
        run: |
          changed=$(bun tools/release/release.ts changed --tag "$GITHUB_REF_NAME")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "### Released ports: $changed" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [vsc, zed, jetbrains, neovim, sublime, notepadpp, telegram, browser]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - run: bun install --frozen-lockfile
      - run: bun run check
      - if: matrix.pkg == 'browser'
        # validate also dry-runs every package; clear them so this job ships only its own
        run: bun run validate && rm -r dist
      - run: bun run package:${{ matrix.pkg }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}-dist
          path: dist/*

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v5
        if: contains(fromJSON(needs.plan.outputs.changed), 'jetbrains')
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Firefox on addons.mozilla.org
        if: contains(fromJSON(needs.plan.outputs.changed), 'browser')
        env:
          FIREFOX_JWT_USER: ${{ secrets.FIREFOX_JWT_USER }}
          FIREFOX_JWT_TOKEN: ${{ secrets.FIREFOX_JWT_TOKEN }}
        run: |
          if [ -z "$FIREFOX_JWT_USER" ] || [ -z "$FIREFOX_JWT_TOKEN" ]; then
            echo "::warning::FIREFOX_JWT_USER / FIREFOX_JWT_TOKEN not set, the Firefox build stays an unsigned zip"
            exit 0
          fi
          v=$(node -p "require('./release.json').ports.browser")
          bun tools/release/release.ts section --port browser --format text > /tmp/amo-notes.txt
          # AMO reviews the human-readable source of bundled code: the browser port and what it imports.
          git archive --format=zip -o /tmp/source.zip HEAD browser tools/jb-palette.json package.json bun.lock release.json
          set +e
          bun tools/release/amo.ts --addon hatsune-miku-tab@vai-rice.space \
            --file "dist/hatsune-miku-editor-firefox-$v.zip" --source /tmp/source.zip \
            --notes /tmp/amo-notes.txt --out "dist/hatsune-miku-editor-firefox-$v.xpi" \
            --approval-notes "Build: bun install --frozen-lockfile && bun browser/build.ts --zip (Bun 1.3+). The add-on is browser/build/firefox." \
            --wait 900
          code=$?
          set -e
          case $code in
            0) echo "Mozilla signed $v, the release carries the .xpi" ;;
            3) echo "::warning::Firefox $v is listed and waits for Mozilla's review; the release keeps the unsigned zip" ;;
            *) echo "::warning::AMO submission failed, the release keeps the unsigned zip" ;;
          esac

      - name: Release notes from the changelogs
        run: bun tools/release/release.ts notes --tag "$GITHUB_REF_NAME" | tee /tmp/notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: /tmp/notes.md

      - name: Publish to Open VSX
        if: contains(fromJSON(needs.plan.outputs.changed), 'vsc')
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -n "$OVSX_TOKEN" ]; then
            bun x ovsx publish dist/*.vsix --pat "$OVSX_TOKEN" || echo "::warning::Open VSX publish failed"
          else
            echo "OVSX_TOKEN not set, skipping"
          fi

      - name: Publish to JetBrains Marketplace
        if: contains(fromJSON(needs.plan.outputs.changed), 'jetbrains')
        env:
          PUBLISH_TOKEN: ${{ secrets.JB_TOKEN }}
        run: |
          if [ -n "$PUBLISH_TOKEN" ]; then
            cd jetbrains
            ./gradlew publishPlugin --no-daemon -q || echo "::warning::JetBrains publish failed"
          else
            echo "JB_TOKEN not set, skipping"
          fi
