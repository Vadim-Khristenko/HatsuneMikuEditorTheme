name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [vsc, zed, jetbrains, neovim, sublime, notepadpp]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package:${{ matrix.pkg }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}-dist
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Generate beautiful notes
        run: |
          cat > /tmp/notes.md << 'EOF'
          ## Hatsune Miku themes — four looks, six editors

          One MIT license covers everything here. No separate fine print per editor.

          **Variants**
          - Miku Dark `#0d0e1a` / `#39c5bb` — deep navy, my daily
          - Miku Light `#f0fafa` / `#007a72` — soft daylight
          - Sakura Dark `#130d14` / `#e87ea1`
          - Sakura Light `#fff5f8` / `#cc4477`

          **Install**
          - VS Code: `dist/hatsune-miku-vsc-*.vsix` → Install from VSIX
          - Zed: `dist/zed-*.zip` → unpack, then Install Dev Extension (marketplace coming soon)
          - JetBrains: `dist/jetbrains-*.zip` → Install Plugin from Disk
          - Neovim: `dist/neovim-*.zip` → `:colorscheme hatsune-miku`
          - Sublime: `dist/sublime-*.zip` → Color Scheme
          - Notepad++: `dist/notepadpp-*.zip` → Settings → Import → Import style theme(s)

          ---
          Auto-generated changelog below.
          EOF
          cat /tmp/notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: /tmp/notes.md
          generate_release_notes: true
      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -n "$OVSX_TOKEN" ]; then
            bun x ovsx publish dist/*.vsix --pat "$OVSX_TOKEN" || echo "OVSX publish failed"
          else
            echo "OVSX_TOKEN not set, skipping"
          fi
      - name: Publish to JetBrains Marketplace
        env:
          JB_TOKEN: ${{ secrets.JB_TOKEN }}
        run: |
          if [ -n "$JB_TOKEN" ]; then
            JB_FILE=$(ls dist/jetbrains-*.zip | head -n1)
            if [ -n "$JB_FILE" ]; then
              echo "Publishing $JB_FILE to JetBrains Marketplace..."
              curl -X POST -H "Authorization: Bearer $JB_TOKEN" -F "file=@$JB_FILE" https://plugins.jetbrains.com/api/plugins --fail || echo "JB publish failed (first upload must be done manually at https://plugins.jetbrains.com/author/me)"
            fi
          else
            echo "JB_TOKEN not set, skipping"
          fi
