name: JetBrains verify
# The Marketplace's plugin verifier on the oldest and the newest IDE (jetbrains/gradle.properties).
# Two IDEs to download, so it runs only when the plugin changes.
on:
  push:
    paths: ["jetbrains/**", ".github/workflows/jetbrains-verify.yml"]
  pull_request:
    paths: ["jetbrains/**", ".github/workflows/jetbrains-verify.yml"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - run: ./gradlew --no-daemon verifyPlugin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verifier-reports
          path: jetbrains/build/reports/pluginVerifier
