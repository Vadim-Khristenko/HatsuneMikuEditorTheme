settings.hint=<html>Uses the IDE's own background image slots, the same ones as View | Appearance | Set Background Image. The drawn art is painted for each Hatsune Miku theme and changes with it; under other themes it steps aside. Pictures you set by hand in that dialog are left alone.</html>
